<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">

	<title>Login</title>
</head>

<body class="ForBody">
	<div class="container">
		<img src="login-left-bg_1.jpg" class="container__image">
		<div class="container__content">
			<img src="medical-symbole-icon.png" class="container__content__logo">
			<p class="container_content__header">Welcome Back</p>
			<p class="container__content__subheader">Log in to your account and we'll get you in</p>
			<p class="container__content__tabName">Email address</p>
			<input id="email" type="email" placeholder="  Email address">
			<p class="container__content__tabName">Password</p>
			<input id="pass" type="password" placeholder="  Password">
			<a href="https://www.webpagetest.org/blank.html"><p class="container__content__forgotten">Forgot password?</a></p>
			<button type="button" class="container__content__signin" id="signIn">Sign in</button>
			<p id="result" style="opacity:0;">Stuff you won't see</p>
			<div class ="revealer" id="reveal">
				<p><span>Don't have an account? </span><a href="https://www.webpagetest.org/blank.html"><span
						class="container__content__others">Sign up</span></a></p>
				<a href="https://www.webpagetest.org/blank.html"><p class="container__content__others">Back to home</p></a>
			</div>
		</div>
	</div>
</body>
	<script src="functions.js"></script>
</html>
